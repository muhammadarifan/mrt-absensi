name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build frontend
        working-directory: frontend
        run: |
          bun install
          VITE_API_URL="${{ secrets.VITE_API_URL }}" bun run build

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host ${{ secrets.SERVER_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync files to server
        run: |
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key"
          rsync -az --delete -e "$RSYNC_SSH" \
            --exclude node_modules --exclude 'attendance.db*' \
            backend/ "root@${{ secrets.SERVER_HOST }}:/var/www/mrt-absensi/backend/"
          rsync -az --delete -e "$RSYNC_SSH" \
            frontend/dist/ "root@${{ secrets.SERVER_HOST }}:/var/www/mrt-absensi/frontend/dist/"
          rsync -az -e "$RSYNC_SSH" \
            db/ "root@${{ secrets.SERVER_HOST }}:/var/www/mrt-absensi/db/"

      - name: Install deps, migrate DB, restart services
        run: |
          ssh -i ~/.ssh/deploy_key "root@${{ secrets.SERVER_HOST }}" '
            export PATH=$HOME/.bun/bin:$PATH
            cd /var/www/mrt-absensi/backend
            WEB_ORIGIN="${{ secrets.WEB_ORIGIN }}"
            if [ -n "$WEB_ORIGIN" ]; then
              echo "WEB_ORIGIN=$WEB_ORIGIN" > .env
            fi
            bun install
            DB_FILE=/var/www/mrt-absensi/backend/attendance.db bun run db:push --force
            pm2 restart mrt-backend
            pm2 restart mrt-frontend
          '
