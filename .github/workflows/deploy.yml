name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build frontend
        working-directory: frontend
        run: |
          bun install
          VITE_API_URL="${{ secrets.VITE_API_URL }}" bun run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key"
          rsync -az --delete -e "$RSYNC_SSH" \
            --exclude node_modules --exclude 'attendance.db*' \
            backend/ "root@${{ secrets.SERVER_HOST }}:/opt/mrt-absensi/backend/"
          rsync -az --delete -e "$RSYNC_SSH" \
            frontend/dist/ "root@${{ secrets.SERVER_HOST }}:/opt/mrt-absensi/frontend/dist/"
          rsync -az -e "$RSYNC_SSH" \
            db/ "root@${{ secrets.SERVER_HOST }}:/opt/mrt-absensi/db/"

      - name: Install deps, migrate DB, restart services
        run: |
          ssh -i ~/.ssh/deploy_key "root@${{ secrets.SERVER_HOST }}" '
            export PATH=$HOME/.bun/bin:$PATH
            cd /opt/mrt-absensi/backend
            bun install
            DB_FILE=/opt/mrt-absensi/backend/attendance.db bun run db:push --force
            pm2 restart mrt-backend
            pm2 restart mrt-frontend
          '
